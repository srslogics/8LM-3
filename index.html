<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f0">
  <title>Log in · 8LM</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="shell">
    <header><a class="brand" href="./" aria-label="8LM home">8LM<span class="brand-period">.</span></a></header>
    <section class="login-panel" aria-labelledby="login-title">
      <div class="form-wrap">
        <h1 id="login-title">Log in</h1>
        <p class="subtitle">Welcome back to 8LM.</p>
        <form id="login-form">
          <div class="field"><label for="identity">Username or email</label><input id="identity" name="username" type="text" placeholder="Enter your username or email" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
          <div class="field"><label for="password">Password</label><div class="password-wrap"><input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required><button class="password-toggle" id="password-toggle" type="button" aria-label="Show password" aria-controls="password" aria-pressed="false">Show</button></div></div>
          <button class="submit" type="submit">Log in</button>
          <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
    <footer>© <span id="year">2026</span> 8LM</footer>
  </main>
</body>
</html>
