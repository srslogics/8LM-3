[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "eightlm"
version = "2.0.0"
description = "8LM workspace and Google Ads management application"
requires-python = ">=3.12"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "psycopg[binary,pool]>=3.2,<4",
 "httpx>=0.28,<1", "pydantic-settings>=2.7,<3", "python-dotenv>=1,<2", "certifi>=2025"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1", "playwright>=1.50,<2", "pip-audit>=2.8,<3"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires an isolated PostgreSQL database", "browser: requires Chrome and running application"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
